# docs_manifest.yaml
# ─────────────────────────────────────────────────────────────────────────────
# AI context configuration manifest per subject
#
# Each subject has the following fields:
#   description   : subject description (included in output header)
#   references    : list of relative paths from project root (Markdown files)
#   env_vars      : list of environment variable keys to include (shows <NOT SET> if missing)
#   generators    : list of Python dotted paths for dynamic data generators
#                   format: "module.path:callable_name"  — callable is () -> str

subjects:
  task-writer:
    description: "AI skill context for automated management of Taiga user stories and tasks."
    # Order matters: the agent reads this bundle top-down, so the normative templates must come
    # early. api_spec.md is deliberately NOT listed here — it is 400 lines of generated CLI --help
    # that pushed the guideline templates past line 500, and it is already served in full by the
    # `api-reference` subject. The command examples task-writer actually needs are inline in
    # task_writer_guideline.md. Adding it back re-creates the burial problem.
    references:
      - task_writer_guideline.md
      - feature_guideline.md
      - future_task_guideline.md
      - issue_guideline.md
      - quick_commands.md
    env_vars: [ ]
    generators:
      - "work_tools.scripts.taiga_custom_attrs:generate_custom_attributes"

  api-reference:
    description: "API specification reference for CLI tools."
    references:
      - api_spec.md
      - quick_commands.md
    env_vars: [ ]
    generators: [ ] # work_tools.scripts.api_spec:generate_all

  slack:
    description: "Guidelines for Slack tasks (posting, searching, summarizing) via the official Slack MCP server. Guidance only — no wt CLI commands for Slack."
    references:
      - slack_guideline.md
    env_vars: [ ]
    generators: [ ]